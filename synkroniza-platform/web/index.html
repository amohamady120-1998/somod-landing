<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Synkroniza BD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy brand rail on the start (right) side, working canvas on a cool navy-tinted ground; bottom tab bar on phones. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#EBF0F5; --line:#DAE2EA; --line-2:#C9D4DF;
  --ink:#0B2338; --ink-2:#465A6E; --ink-3:#7A8A9B;
  --rail:#0B2338; --rail-ink:#C9D6E3; --rail-hi:#FFFFFF; --rail-sel:#163752;
  --accent:#D4561A; --accent-ink:#FFFFFF; --accent-soft:#FCEADF; --accent-line:#F2C2A6;
  --good:#1D7F53; --good-soft:#E1F3EA; --warn:#9A6512; --warn-soft:#FBF0D9;
  --bad:#B53A33; --bad-soft:#FBE5E3; --info:#2A659F; --info-soft:#E2EEF9; --mute-soft:#EDF1F5;
  --shadow:0 1px 2px rgba(11,35,56,.06),0 8px 24px rgba(11,35,56,.08);
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1621; --surface:#122030; --surface-2:#182a3c; --line:#24374B; --line-2:#30465C;
  --ink:#E7EEF5; --ink-2:#A7B6C6; --ink-3:#7C8DA0;
  --rail:#08121C; --rail-ink:#9FB1C3; --rail-hi:#FFFFFF; --rail-sel:#15283B;
  --accent:#F07A3C; --accent-ink:#1B0D04; --accent-soft:#3A2214; --accent-line:#6B3A1F;
  --good:#45C08A; --good-soft:#123326; --warn:#E0A84A; --warn-soft:#352912;
  --bad:#EE7A72; --bad-soft:#3A1A18; --info:#6FA8E0; --info-soft:#14283D; --mute-soft:#1A2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1621; --surface:#122030; --surface-2:#182a3c; --line:#24374B; --line-2:#30465C;
  --ink:#E7EEF5; --ink-2:#A7B6C6; --ink-3:#7C8DA0;
  --rail:#08121C; --rail-ink:#9FB1C3; --rail-hi:#FFFFFF; --rail-sel:#15283B;
  --accent:#F07A3C; --accent-ink:#1B0D04; --accent-soft:#3A2214; --accent-line:#6B3A1F;
  --good:#45C08A; --good-soft:#123326; --warn:#E0A84A; --warn-soft:#352912;
  --bad:#EE7A72; --bad-soft:#3A1A18; --info:#6FA8E0; --info-soft:#14283D; --mute-soft:#1A2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-data);font-size:12px;letter-spacing:.02em}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding-block:20px;padding-inline:14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:var(--rail-hi)}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--rail-ink);letter-spacing:.08em}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:8px;color:var(--rail-ink);cursor:pointer;text-align:start;font-weight:500}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{color:var(--rail-hi);background:var(--rail-sel)}
.nav-btn[aria-current="page"]{color:var(--rail-hi);background:var(--rail-sel);box-shadow:inset -3px 0 0 var(--accent)}
.nav-btn .badge{margin-inline-start:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.rail-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--rail-sel);display:flex;align-items:center;gap:10px;font-size:12px}
.rail-foot img{width:28px;height:28px;border-radius:50%}

.main{min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.top .sub{color:var(--ink-3);font-size:13px}
.top .grow{flex:1}
.view{padding-block:20px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn-sm{padding:5px 10px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)} .pill.i{background:var(--info-soft);color:var(--info)}
.pill.a{background:var(--accent-soft);color:var(--accent)} .pill.n{background:var(--mute-soft);color:var(--ink-2)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-2)}
.chip.hot{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;margin:0;font-weight:700}
.panel-h .meta{color:var(--ink-3);font-size:12px;margin-inline-start:auto}
.panel-b{padding:14px 16px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink-3);margin-inline-start:4px}
.kpi .h{font-size:12px;color:var(--ink-2)}
.kpi.lead{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

.fu{display:flex;flex-direction:column}
.fu-item{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.fu-item:last-child{border-bottom:0}
.fu-item .stripe{align-self:stretch;border-radius:4px;background:var(--line-2)}
.fu-item.over .stripe{background:var(--bad)} .fu-item.today .stripe{background:var(--accent)}
.fu-item .t{font-weight:600;overflow-wrap:anywhere}
.fu-item .s{font-size:12px;color:var(--ink-3)}
.fu-item .d{font-size:12px;font-weight:600;text-align:end}
.fu-item.over .d{color:var(--bad)} .fu-item.today .d{color:var(--accent)}
.linky{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:start;font-weight:inherit}
.linky:hover{color:var(--accent)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12px}
.bar-track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--ink-2);border-radius:5px}
.bar-row.won .bar-fill{background:var(--good)} .bar-row.hot .bar-fill{background:var(--accent)}
.bar-row .val{text-align:end;color:var(--ink-2)}

.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;height:110px;padding-top:10px}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--ink-3)}
.wk .col{width:100%;max-width:28px;background:var(--line-2);border-radius:4px 4px 0 0;min-height:2px}
.wk.cur .col{background:var(--accent)}
.wk .n{color:var(--ink-2);font-weight:600}

.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:10px}
.person img{width:28px;height:28px;border-radius:50%}
.person .nm{font-weight:600}
.person .ct{margin-inline-start:auto;font-weight:700}

.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-item .ico{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.feed-item .ico svg{width:15px;height:15px}
.feed-item .t{font-weight:600}
.feed-item .s{font-size:12px;color:var(--ink-3)}
.feed-item p{margin:4px 0 0;color:var(--ink-2);overflow-wrap:anywhere;white-space:pre-wrap}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:0}
.search input{width:100%;padding:9px 36px 9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
select.f,input.f,textarea.f{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0;max-width:100%}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.count{color:var(--ink-3);font-size:12px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-inline:0;border-top:0;text-align:start}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow.head{cursor:default;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-3);padding-block:8px}
.lrow .nm{font-weight:600;overflow-wrap:anywhere}
.lrow .sm{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.lrow .cell{min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.lrow.c5{grid-template-columns:minmax(0,1.6fr) minmax(0,1.6fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr)}
.more{display:flex;justify-content:center;padding:12px}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:240px}
.kcol.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol-h{padding:10px 12px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.kcol-h b{font-size:13px}
.kcol-h span{font-size:12px;color:var(--ink-3)}
.kcol-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kcard .t{font-weight:600;overflow-wrap:anywhere}
.kcard .s{font-size:12px;color:var(--ink-3)}
.kcard .r{display:flex;align-items:center;gap:8px;font-size:12px}
.kcard .r .v{font-weight:700}
.kcard .r .d{margin-inline-start:auto;color:var(--ink-3)}
.kcard .r .d.over{color:var(--bad);font-weight:600}
.kcard select{font-size:12px;padding:4px 6px}
.kempty{font-size:12px;color:var(--ink-3);text-align:center;padding:18px 6px;border:1px dashed var(--line-2);border-radius:8px}

.tender{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-inline:0;border-top:0;text-align:start}
.tender:last-child{border-bottom:0}
.tender:hover{background:var(--surface-2)}
.due{border:1px solid var(--line-2);border-radius:8px;text-align:center;padding:6px 4px;line-height:1.2}
.due b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.due span{font-size:11px;color:var(--ink-3)}
.due.urgent{border-color:var(--bad);color:var(--bad)} .due.soon{border-color:var(--accent-line);color:var(--accent)} .due.past{opacity:.55}
.tender .t{font-weight:700;overflow-wrap:anywhere}
.tender .s{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.tender .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.score{font-family:var(--f-data);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.score.go{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--warn-soft);color:var(--warn)} .score.no{background:var(--bad-soft);color:var(--bad)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-3);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tpl{display:flex;flex-direction:column;gap:10px}
.tpl pre{margin:0;white-space:pre-wrap;font-family:var(--f-ui);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink);line-height:1.8;overflow-wrap:anywhere}
.tpl .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.svc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc .code{font-family:var(--f-data);font-size:12px;color:var(--accent);padding-top:2px}
.svc b{display:block}
.svc p{margin:2px 0 0;color:var(--ink-2);font-size:13px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px;color:var(--ink-2)}
.empty h3{margin:0;color:var(--ink);font-size:17px}
.empty p{margin:0;max-width:52ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:760px;margin-top:8px;text-align:start}
.steps div{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.steps b{display:block;color:var(--accent);font-family:var(--f-data);font-size:12px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(6,16,26,.45);z-index:40}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(600px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{padding:18px 20px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer-h .row{display:flex;align-items:flex-start;gap:10px}
.drawer-h h2{margin:0;font-size:19px;flex:1;text-wrap:balance}
.drawer-h .sub{color:var(--ink-3);font-size:13px}
.drawer-b{overflow-y:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--ink-3);border-inline-start:3px solid var(--line-2);padding-inline-start:10px}
.mini{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mini > *{padding:10px 12px;border-bottom:1px solid var(--line)}
.mini > *:last-child{border-bottom:0}
.mini .t{font-weight:600}
.mini .s{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h3{margin:0;font-size:14px}
.sec-h .btn{margin-inline-start:auto}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal-card{position:relative;background:var(--surface);border-radius:12px;width:min(620px,100%);max-height:calc(100% - 32px);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-card header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-card header h2{margin:0;font-size:17px;flex:1}
.form{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld .f{width:100%}
.fld textarea.f{min-height:84px;resize:vertical}
.form-foot{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding-top:6px}
.form-foot .sp{flex:1}
.crit{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px}
.crit-row{display:grid;grid-template-columns:minmax(0,1fr) 140px 26px;gap:10px;align-items:center;font-size:13px}
.crit-row input{width:100%;accent-color:var(--accent)}

async function runAI(mode,ctx){
 if(!S.sample){toast('المساعد الذكي مش متاح في وضعك الحالي');return}
 const spec=AI_SPECS[mode];if(!spec)return;
 if(spec.phase==='input'&&(!ctx||ctx.input==null)){S.ai={mode,title:spec.title,phase:'input',ph:spec.ph,input:'',text:'',busy:false,ctx:ctx||{},actions:spec.actions};renderAIModal();return}
 S.ai={mode,title:spec.title,phase:'run',text:'',busy:true,err:null,ctx:ctx||{},actions:spec.actions,scores:null};renderAIModal();
 try{
  const input=spec.build(ctx||{});
  const res=await S.sample(input,{modelTier:spec.tier||'default',onText:({text})=>{S.ai.text=text;renderAIModal()}});
  S.ai.text=(res&&res.text)||S.ai.text;S.ai.busy=false;S.ai.phase='done';
  if(spec.after)spec.after(S.ai.text,S.ai.ctx);
  renderAIModal();
 }catch(e){S.ai.busy=false;S.ai.err=(e&&e.code)||'error';S.ai.phase='done';renderAIModal()}
}

async function readFileText(file,onProg){
 const n=(file.name||'').toLowerCase();
 if(/\.pdf$/.test(n)||file.type==='application/pdf'){const L=await pdfLib();const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();let line='';const lines=[];
   c.items.forEach(it=>{line+=it.str;if(it.hasEOL){lines.push(line);line=''}else line+=' '});if(line)lines.push(line);
   out.push('— صفحة '+i+' —\n'+lines.join('\n').replace(/[ \t]+/g,' '));if(onProg)onProg(i,doc.numPages)}
  const text=out.join('\n\n');const real=text.replace(/— صفحة \d+ —|\s/g,'').length;
  return {text,pages:doc.numPages,kind:'pdf',poor:real<doc.numPages*150}}
 if(/\.docx$/.test(n)){await loadScript(LIBS.mammoth);const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {text:r.value||'',pages:null,kind:'docx',poor:false}}
 if(/\.(txt|md|csv)$/.test(n)||/^text\//.test(file.type))return {text:await file.text(),pages:null,kind:'text',poor:false};
 throw {code:'unsupported'}}
async function pdfOCR(file,from,to,onProg){
 const lim=S.limits&&S.limits.images;if(!lim)throw {code:'no_images'};
 const L=await pdfLib();const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
 to=Math.min(to,doc.numPages);const per=Math.max(1,Math.min(lim.maxCount||4,4));let out='';
 for(let i=from;i<=to;i+=per){if(S.st.stop)break;const imgs=[];
  for(let j=i;j<Math.min(i+per,to+1);j++){const pg=await doc.getPage(j);const vp=pg.getViewport({scale:1.5});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;imgs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8)))}
  if(onProg)onProg(i,to);
  const r=await S.sample('انسخ النص الموجود في صور صفحات كراسة الشروط هذه حرفياً وبالترتيب، صفحة صفحة (تبدأ من الصفحة '+i+')، مع كتابة الجداول كسطور مفصولة بـ | . لا تلخّص ولا تعلّق. ابدأ كل صفحة بسطر «— صفحة ن —».',{images:imgs,modelTier:'default'});
  out+=((r&&r.text)||'')+'\n\n'}
 return {text:out,pages:doc.numPages}}

/* ---------- insights ---------- */
function rangeInfo(r){const d=new Date();
 if(r==='month')return {start:isoOf(new Date(d.getFullYear(),d.getMonth(),1)),months:1,t:'الشهر الحالي'};
 if(r==='quarter')return {start:isoOf(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1)),months:3,t:'الربع الحالي'};
 if(r==='year')return {start:d.getFullYear()+'-01-01',months:12,t:'السنة الحالية'};
 return {start:'0000',months:0,t:'كل الفترات'}}
function insightsData(){
 const R=rangeInfo(S.insRange),st=settings(),O=S.data.opps,t=todayISO();
 const won=O.filter(o=>o.stage==='won'&&(o.wonAt||String(o.updatedAt||'').slice(0,10))>=R.start);
 const lost=O.filter(o=>o.stage==='lost'&&(o.lostAt||String(o.updatedAt||'').slice(0,10))>=R.start);
 const wonVal=won.reduce((s,o)=>s+Number(o.value||0),0);
 const winRate=won.length+lost.length?Math.round(won.length/(won.length+lost.length)*100):null;
 const cyc=won.filter(o=>o.wonAt&&o.createdAt).map(o=>(new Date(o.wonAt)-new Date(String(o.createdAt).slice(0,10)))/864e5);
 const avgCycle=cyc.length?Math.round(cyc.reduce((a,b)=>a+b,0)/cyc.length):null;
 const target=R.months?Number(st.monthlyRevenue||0)*R.months:0;
 const created=O.filter(o=>String(o.createdAt||'').slice(0,10)>=R.start);
 const order=['target','contacted','meeting','proposal','negotiation','won'];
 const funnel=order.map((k,i)=>({k,t:stageOf(k).t,n:created.filter(o=>{const si=order.indexOf(o.stage);return o.stage==='lost'?false:si>=i}).length}));
 const reasons={};lost.forEach(o=>{const r=o.lostReason||'غير مسجّل';reasons[r]=(reasons[r]||0)+1});
 const fc=[];const d0=new Date();for(let i=0;i<6;i++){const m=new Date(d0.getFullYear(),d0.getMonth()+i,1);const key=isoOf(m).slice(0,7);const os=O.filter(o=>o.stage!=='won'&&o.stage!=='lost'&&o.closeDate&&o.closeDate.slice(0,7)===key);fc.push({key,label:AR_MONTHS[m.getMonth()],v:os.reduce((s,o)=>s+Number(o.value||0),0),w:os.reduce((s,o)=>s+Number(o.value||0)*(o.prob!=null&&o.prob!==''?Number(o.prob):stageOf(o.stage).p)/100,0),n:os.length})}
 const noClose=O.filter(o=>o.stage!=='won'&&o.stage!=='lost'&&!o.closeDate).length;
 const X=S.data.acts.filter(a=>(a.date||'')>=R.start);
 const byType={};X.forEach(a=>{byType[a.type]=(byType[a.type]||0)+1});
 const byPerson={};X.forEach(a=>{const k=a.by||'';byPerson[k]=(byPerson[k]||0)+1});
 const pos=X.filter(a=>a.outcome==='positive').length,resp=X.filter(a=>a.outcome&&a.outcome!=='noreply').length;
 const T=S.data.tenders.filter(x=>String(x.createdAt||'').slice(0,10)>=R.start);
 const tSub=T.filter(x=>['submitted','won','lost'].includes(x.status)).length,tWon=T.filter(x=>x.status==='won').length,tLost=T.filter(x=>x.status==='lost').length,tNogo=T.filter(x=>x.status==='nogo').length;
 const src={};O.filter(o=>String(o.createdAt||'').slice(0,10)>=R.start).forEach(o=>{const k=o.source||'غير محدد';src[k]=(src[k]||0)+Number(o.value||0)});
 const renew=O.filter(o=>o.stage==='won'&&o.endDate&&daysTo(o.endDate)>=0&&daysTo(o.endDate)<=120).sort((a,b)=>a.endDate<b.endDate?-1:1);
 const stale=O.filter(o=>o.stage!=='won'&&o.stage!=='lost'&&daysTo(String(o.updatedAt||o.createdAt||t).slice(0,10))<-21);
 return {R,won,lost,wonVal,winRate,avgCycle,target,funnel,reasons,fc,noClose,X,byType,byPerson,pos,resp,tSub,tWon,tLost,tNogo,T,src,renew,stale,created}}

  +'<div class="kpi"><span class="l">متوسط مدة الصفقة</span><span class="v num">'+(D.avgCycle==null?'—':D.avgCycle)+'<small>يوم</small></span><span class="h">من فتح الفرصة للفوز</span></div>'

async function lfSearch(){
 const LF=S.lf;const sec=SECTORS.find(s=>s[0]===bv('lf.sector','banking'))||SECTORS[0];
 const kw=String(bv('lf.kw','')).split(/[,،]/).map(x=>x.trim()).filter(Boolean);
 const keys=sec[2].concat(kw).slice(0,6);
 const minI=SIZES.findIndex(x=>x[0]===bv('lf.size','201-500'));const sizes=SIZES.slice(Math.max(0,minI)).map(x=>x[0]);
 const sa=bv('lf.scope','sa')==='sa';
 LF.busy='بدوّر في قاعدة بيانات الشركات…';LF.err=null;LF.ranked=false;render();
 try{const seen={},out=[];
  const add=p=>{(p&&p.companies?Object.values(p.companies):[]).forEach(c=>{const s=slimCo(c);if(!s.domain||seen[s.domain])return;if(sa&&s.country&&s.country!=='Saudi Arabia'&&s.country!=='SA')return;seen[s.domain]=1;out.push(s)})};
  add(await mcpCall('Clay','search-companies',{dslQuery:lfQuery(keys,sizes,true)}));
  if(out.length<8){LF.busy='بوسّع البحث…';render();add(await mcpCall('Clay','search-companies',{dslQuery:lfQuery(keys,sizes,false)}))}
  LF.results=out;if(!out.length)LF.err='مالقيتش شركات بالمعايير دي — جرّب حجم أصغر أو كلمات مختلفة.'}
 catch(e){LF.err=mcpErrMsg(e,LEAD_NAME)}
 LF.busy=false;render()}

  const j=await aiJSON('أنت مدير تطوير أعمال خبير في السوق السعودي. قيّم كل شركة من القائمة كهدف محتمل لشركتنا من 0 إلى 100 (احتمال أن تحتاج خدماتنا وأن نصل لها). أعد JSON فقط: مصفوفة [{"domain":"","fit":0,"why":"سبب في جملة قصيرة بالعربي","service":"الخدمة الأنسب كمدخل"}] لكل الشركات.\n\nعن شركتنا:\n'+companyCtx(3000)+'\n\nالشركات:\n'+JSON.stringify(list),'default');

function parseCSV(t){t=String(t||'').replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;const d=(t.split('\n')[0].split('\t').length>t.split('\n')[0].split(',').length)?'\t':(t.split('\n')[0].split(';').length>t.split('\n')[0].split(',').length?';':',');
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}
 if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()))}

document.addEventListener('input',e=>{const el=e.target;const b=el.dataset&&el.dataset.bind;if(b)S.bind[b]=el.type==='checkbox'?el.checked:el.value;

document.addEventListener('change',async e=>{const el=e.target,id=el.id,d=el.dataset||{};
 if(d.bind){S.bind[d.bind]=el.value;if(d.rerender)render();if(d.save)saveBound(d.save,el);return}
 if(id==='f-bench'){S.benchSt=el.value;render();return}
 if(id==='f-ins'){S.insRange=el.value;render();return}
 if(id==='f-workwho'){S.workWho=el.value;render();return}
 if(id==='f-repp'){S.repPeriod=el.value;if(el.value!=='custom'&&el.value!=='day'){S.repFrom='';S.repTo=''}render();return}
 if(id==='f-repfrom'){S.repFrom=el.value;render();return}
 if(id==='f-repto'){S.repTo=el.value;render();return}
 if(id==='f-repwho'){S.repWho=el.value;render();return}
 if(id==='f-news'){S.newsF=el.value;render();return}
 if(id==='imp-file'){const f=el.files&&el.files[0];el.value='';if(f){f.text().then(t=>{S.bind['imp.csv']=t;render()})}return}
 if(id==='bk-file'){const f=el.files&&el.files[0];el.value='';if(f)backupImport(f);return}
 if(id==='st-tender'){S.st.tid=el.value||null;S.st.err=null;render();return}
 if(id==='kb-file'){const fs=[...(el.files||[])];el.value='';if(fs.length)kbUpload(fs);return}

 if(id==='st-ocr'){const f=el.files&&el.files[0];el.value='';if(f)stUpload(f,true);return}
 if(d.k2==='cmpS'){const tid=S.st.tid;await ensureProp(tid);const o={};o[d.rid]={s:el.value};patch('proposals',tid,{compliance:o});return}
 if(d.k2==='doc'){const tid=S.st.tid;await ensureProp(tid);const o={};o['d'+d.i]=el.checked;patch('proposals',tid,{docs:o});return}

const _saveT={};
function saveBound(kind,el){const tid=S.st.tid;if(!tid||!S.canWrite)return;
 if(kind==='sec'){clearTimeout(_saveT.sec);_saveT.sec=setTimeout(()=>{const secs=liveSecs(tid);const P=propOf(tid);const old=P&&P.sections;if(old&&JSON.stringify(old.map(s=>[s.title,s.body]))===JSON.stringify(secs.map(s=>[s.title,s.body])))return;saveSecs(tid,secs)},300);return}
 if(kind.indexOf('cmp:')===0){const rid=kind.slice(4);const v=String(el.value);const P=propOf(tid)||{};const c=(P.compliance||{})[rid]||{};if((c.n||'')===v)return;ensureProp(tid).then(()=>{const o={};o[rid]={n:v};patch('proposals',tid,{compliance:o})})}}

(async function boot(){
 const C=window.claude;
 if(!C||!C.use){S.noDb=true;render();return}
 const [db,user]=await Promise.all([C.use('db').catch(()=>null),C.use('user').catch(()=>null)]);
 S.user=user;
 C.use('sample').then(s=>{if(s){S.sample=s;S.aiReady=true;scheduleRender();if(s.limits)s.limits().then(l=>{S.limits=l;scheduleRender()}).catch(()=>{})}}).catch(()=>{});
 C.use('mcp').then(m=>{if(m){S.mcp=m;scheduleRender()}}).catch(()=>{});
 C.use('assets').then(a=>{if(a){S.assets=a;scheduleRender()}}).catch(()=>{});
 if(user){try{S.me=await user.me();S.uid=S.me.id||null}catch(e){}
  try{const c=await user.can('data.write');if(c===false)S.canWrite=false}catch(e){}}
 if(!db){S.noDb=true;S.canWrite=false;render();return}
 S.db=db;
 COLS.forEach(col=>{
  try{db.collection(col).onSnapshot(snap=>{S.data[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded[col]=true;scheduleRender()},
   err=>{S.loaded[col]=true;if(err&&err.code==='revoked'){S.noDb=true;S.canWrite=false}scheduleRender()})}catch(e){S.loaded[col]=true}
 });
 render();
})();
})();
