# Run once after creating the Supabase project, and again whenever you add/change a key or update the code.
name: Setup Supabase
on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Database schema
        run: psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Keys for the server functions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AI_ORDER: ${{ secrets.AI_ORDER }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          LUSHA_API_KEY: ${{ secrets.LUSHA_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          ENRICH_ORDER: ${{ secrets.ENRICH_ORDER }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER: ${{ secrets.MS_SENDER }}
          MS_DOMAIN: ${{ secrets.MS_DOMAIN }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          args=()
          for k in ANTHROPIC_API_KEY CLAUDE_MODEL GEMINI_API_KEY GEMINI_MODEL OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL AI_ORDER APOLLO_API_KEY LUSHA_API_KEY HUNTER_API_KEY ENRICH_ORDER MS_TENANT_ID MS_CLIENT_ID MS_CLIENT_SECRET MS_SENDER MS_DOMAIN INGEST_KEY; do
            v="${!k}"; if [ -n "$v" ]; then args+=("$k=$v"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
      - name: Deploy server functions
        run: |
          supabase functions deploy ai --project-ref "$PROJECT_REF"
          supabase functions deploy integrations --project-ref "$PROJECT_REF"
          supabase functions deploy ingest --project-ref "$PROJECT_REF" --no-verify-jwt
